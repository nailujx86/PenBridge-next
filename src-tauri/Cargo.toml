[package]
name = "penbridge-tauri"
version = "1.0.0"
description = "PenBridge Tauri"
authors = ["Julian Blazek"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penbridge_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = { version = "0.18.5", features = ["extensions"] }
axum = "0.8.8"
tokio = { version = "1.50.0", features = ["sync", "rt"] }
win32pointer_rs = { version = "0.1.0", path = "../../win32pointer_rs" } # https://github.com/nailujx86/win32pointer_rs
rand = "0.9"
local-ip-address = "0.6"
tower-http = { version = "0.6", features = ["cors"] }
log = "0.4"
env_logger = "0.11"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"

